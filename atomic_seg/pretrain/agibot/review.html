<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agibot · 原子动作检查</title>
<style>
@font-face{font-family:review;src:url(review.woff)}*{box-sizing:border-box}body{margin:0;background:#0d1420;color:#e8edf5;font:14px review,system-ui,sans-serif}header{padding:28px 36px;border-bottom:1px solid #29354a;display:flex;justify-content:space-between;gap:20px}h1{font-size:27px;margin:0 0 8px}p{line-height:1.65;color:#9eafc6;margin:6px 0}.tag{color:#72dbc0;font-size:12px;letter-spacing:2px}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:90vh}aside{padding:20px;border-right:1px solid #29354a}.ep{display:block;width:100%;text-align:left;margin:0 0 10px;padding:15px;border:1px solid #334159;background:#172135;color:#e8edf5;border-radius:9px;cursor:pointer;line-height:1.5}.ep.active{border-color:#60d9bd;background:#1a3540}.ep small{display:block;color:#9cabc1;margin-top:5px}main{padding:25px 30px;min-width:0}h2{font-size:20px;margin:0 0 8px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{border:1px solid #293950;border-radius:9px;padding:12px 20px;min-width:130px}.stat b{display:block;font-size:24px;color:#86e6d2}.videos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}video{width:100%;background:#05080e;border-radius:8px}.caption{color:#a9b8cc;margin:7px 0}.controls{display:flex;gap:14px;align-items:center;margin:16px 0}input[type=range]{flex:1;min-width:40px;accent-color:#67d9bb}button{font:inherit}button.action{background:#255b58;color:white;border:1px solid #63cfb1;padding:8px 15px;border-radius:7px;cursor:pointer}.timeline{height:38px;display:flex;gap:2px;margin:15px 0}.seg{border:0;min-width:2px;cursor:pointer;border-radius:3px;color:#091522;font-size:11px;padding:0;overflow:hidden}.seg.active{outline:2px solid white;outline-offset:2px}.legend{display:flex;gap:14px;flex-wrap:wrap;color:#aab9cd;font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}svg{width:100%;height:100px;background:#121e30;border-radius:8px;margin-top:12px}.detail{padding:20px;border:1px solid #334159;border-radius:10px;margin-top:20px;background:#131f31}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shots img{width:100%;border-radius:6px;cursor:pointer}.pill{display:inline-block;border:1px solid #436378;color:#9bddcf;border-radius:20px;padding:4px 10px;margin:6px 7px 7px 0}.warning{background:#3d2b25;border:1px solid #775742;color:#f4c49a;padding:18px;border-radius:8px;line-height:1.7}.good{color:#88dec5}details{margin:16px 0;border:1px solid #304159;border-radius:8px;padding:12px}summary{cursor:pointer;color:#bdccdf}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:12px;color:#c5d4e7;max-height:450px;overflow:auto}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #26364d;text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#1f3249}a{color:#8be4d0}.muted{color:#92a5bf;font-size:12px}.hidden{display:none}@media(max-width:800px){header{padding:20px}.layout{grid-template-columns:1fr}aside{border-right:0;display:flex;gap:8px;overflow:auto}.ep{min-width:220px}main{padding:18px}.videos,.shots{grid-template-columns:1fr}.stats{gap:7px}.stat{min-width:105px;padding:10px}table{font-size:12px}td,th{padding:7px}}
</style>
<header><div><div class="tag">AGIBOT / ATOMIC ACTIONS</div><h1>原子动作分割 · 实测轨迹检查</h1><p>整条验收 · 底盘静止 · 16D 相邻实测参考动作 · 两组独立续跑</p></div><div class="muted" id="total"></div></header>
<div class="layout"><aside id="episodes"></aside><main id="main"></main></div>
<script>
const DATA=__DATA__;let current=null,playing=false,selected=0;const colors={move:'#5fcbbb',turn:'#bd9ceb',lift:'#80bfff',lower:'#e9bc70',open_gripper:'#e694ac',close_gripper:'#e98170',still:'#728299'};
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stateName=x=>({complete:'已完整导出',segmented:'分割完成',media_ready:'分割与图像完成',rejected:'整条舍弃',annotating:'标注中',annotation_rejected:'标注未通过',retryable_error:'等待重试'}[x]||x);
function details(title,value){return `<details><summary>${title}</summary><pre>${esc(JSON.stringify(value,null,2))}</pre></details>`}
el('total').innerHTML=`${DATA.examples.length} 条真实样本<br>源目录：agibot_beta_v3`;
el('episodes').innerHTML=DATA.examples.map((e,i)=>`<button class="ep" data-episode="${i}">${esc(e.episode_id)}<small>${stateName(e.status)} · group ${e.group}<br>${e.source_rows.toLocaleString()} 个实测状态</small></button>`).join('');
document.querySelectorAll('[data-episode]').forEach(b=>b.onclick=()=>showEpisode(+b.dataset.episode));
function showEpisode(i){document.querySelectorAll('video').forEach(v=>v.pause());playing=false;current=DATA.examples[i];selected=0;document.querySelectorAll('.ep').forEach((b,k)=>b.classList.toggle('active',i===k));const e=current;
let html=`<h2>${esc(e.episode_id)}</h2><p>${esc(e.task)}</p><div class="stats"><div class="stat"><b>${e.source_rows.toLocaleString()}</b>实测状态</div><div class="stat"><b>${e.reference_rows?.toLocaleString()??'—'}</b>参考动作</div><div class="stat"><b>${e.segments.length||'—'}</b>原子片段</div><div class="stat"><b>16D</b>末端 guide 合同</div></div>`;
if(!e.segments.length){html+=`<div class="warning">${stateName(e.status)}。该 episode 未进入分割或训练数据。<br>${e.reasons.map(r=>esc(r.code)+(r.first_frame!==undefined?' · 首次证据帧 '+r.first_frame:'')).join('<br>')}</div>`+details('完整判定与证据',e.reasons)+details('各项检查状态',e.checks);el('main').innerHTML=html;return}
html+=`<div class="videos">${e.cameras.map(c=>`<div><video playsinline preload="auto" src="${esc(c.video)}"></video><div class="caption">${esc(c.name)}</div></div>`).join('')}</div><div class="controls"><button class="action" id="play">播放</button><input id="time" type="range" min="0" max="${(e.source_rows-1)/30}" step="0.0333333" value="0"><span id="clock">0.00 s</span></div><div class="timeline">${e.segments.map((s,i)=>`<button class="seg" data-segment="${i}" style="flex:${s.valid_action_rows};background:${colors[s.left_action==='still'?s.right_action:s.left_action]||colors.move}" title="${i}: ${s.start_frame}–${s.end_frame}">${i+1}</button>`).join('')}</div><div class="legend">${Object.entries(colors).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('')}</div><svg id="grippers" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg><p class="muted">实测夹爪开度参考值：绿色左手、紫色右手。点击色块查看完整片段，点击截图跳到对应观测。</p><div id="segment-detail"></div>`;
if(!e.model_labels)html+=`<div class="warning" style="margin-top:18px">本页已完成真实数据检查和数值分割，尚未生成 Qwen 子任务文本。下方只展示数值动作标签与原始来源，不将模板文字视为模型标注。</div>`;
html+=details('16D action / guide 定义',DATA.contract)+details('学生 system prompt',DATA.student_system)+details('Teacher system prompt',DATA.teacher_system)+details('完整检查状态',e.checks)+`<p><a href="${e.id}/segmentation.json" download>下载分割 JSON</a> · <a href="${e.id}/decision.json" download>下载整条判定 JSON</a></p><table><thead><tr><th>片段</th><th>动作行</th><th>左臂 / 右臂</th><th>chunks</th></tr></thead><tbody>${e.segments.map((s,i)=>`<tr data-row="${i}"><td>${i+1}</td><td>${s.start_frame}–${s.end_frame}</td><td>${esc(s.left_action)} / ${esc(s.right_action)}</td><td>${s.num_chunks}</td></tr>`).join('')}</tbody></table>`;
el('main').innerHTML=html;document.querySelectorAll('[data-segment],[data-row]').forEach(b=>b.onclick=()=>showSegment(+(b.dataset.segment??b.dataset.row),true));el('time').oninput=()=>seek(+el('time').value);el('play').onclick=()=>{playing=!playing;document.querySelectorAll('video').forEach(v=>playing?v.play().catch(()=>{}):v.pause());el('play').textContent=playing?'暂停':'播放'};
const sig=e.signal;el('grippers').innerHTML=['left_gripper','right_gripper'].map((k,i)=>`<polyline fill="none" stroke="${i?'#bd9ceb':'#5fcbbb'}" stroke-width="2" points="${sig[k].map((v,j)=>`${sig.frames[j]/(e.source_rows-1)*1000},${85-v*70}`).join(' ')}"/>`).join('');showSegment(0,false)}
function seek(t){document.querySelectorAll('video').forEach(v=>v.currentTime=t);el('time').value=t;el('clock').textContent=t.toFixed(2)+' s'}
function showSegment(i,move){selected=i;const s=current.segments[i];document.querySelectorAll('.seg').forEach((b,j)=>b.classList.toggle('active',i===j));el('segment-detail').innerHTML=`<div class="detail"><h2>片段 ${i+1} · ${s.start_s.toFixed(2)}–${s.end_s.toFixed(2)} s</h2><span class="pill">${s.valid_action_rows} 条动作</span><span class="pill">${s.num_chunks} chunks</span><span class="pill">目标观测 ${s.target_observation_frame}</span><p>${esc(s.sub_task||s.primary_action_verb)}</p><div class="shots">${s.shots.map(x=>`<div><img data-seek="${x.frame/30}" src="${esc(x.path)}"><p class="muted">观测帧 ${x.frame}</p></div>`).join('')}</div>${details('16D guide 与原语来源',s)}</div>`;document.querySelectorAll('[data-seek]').forEach(im=>im.onclick=()=>seek(+im.dataset.seek));if(move)seek(s.start_s)}
function tick(){const v=document.querySelector('video');if(playing&&v){el('time').value=v.currentTime;el('clock').textContent=v.currentTime.toFixed(2)+' s';if(v.ended){playing=false;el('play').textContent='播放'}}requestAnimationFrame(tick)}if(DATA.examples.length)showEpisode(0);tick();
</script></html>
