<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealOmni · 真实样本检查</title>
<style>
@font-face{font-family:ReviewCJK;src:url('review-cjk.woff')}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#22364e;font:14px ReviewCJK,system-ui,sans-serif}a{color:#315fd3}button,input,select{font:inherit}button,summary{cursor:pointer}button{border:1px solid #cbd7e5;border-radius:6px;background:white;padding:8px 12px;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #829fec;outline-offset:2px}header{padding:28px 4vw;background:white;border-bottom:1px solid #dce4ee}h1{margin:8px 0;font-size:28px}p{line-height:1.7}small,.muted{color:#64788f}.stats,.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.stat{padding:10px 14px;border-radius:7px;background:#f0f4fa}.stat b{font-size:20px;margin-right:7px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:24px;padding:24px 4vw;max-width:1680px;margin:auto}aside{position:sticky;top:20px;align-self:start;min-width:0}nav button{display:block;text-align:left;width:100%;margin:8px 0;padding:12px}nav button.active{border-color:#759ae9;background:#eef4ff}nav strong{display:block;margin:7px 0}main{min-width:0}h2{font-size:23px;margin:0 0 12px}.path{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:#63778f}.badge{display:inline-block;padding:4px 7px;border-radius:5px;background:#fbe8e2;color:#a24428;font-size:11px}.notice{background:#fff4df;border-left:3px solid #b78739;padding:12px 15px;font-size:13px;line-height:1.75;margin:16px 0}.panel{background:white;border:1px solid #dce4ee;border-radius:10px;padding:18px;margin:18px 0}.panel h3{margin:0 0 12px;font-size:16px}.videos,.storyboard{display:grid;grid-template-columns:1fr 1fr;gap:15px}video{display:block;width:100%;max-height:350px;background:#111a27;border-radius:7px}figure{margin:0}figcaption{font-size:12px;color:#64788f;margin:7px 0}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:100px;accent-color:#4266b1}.timer{font:12px ui-monospace,monospace;min-width:120px}.coverage{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e4eaf1;white-space:nowrap}th{color:#66798e;font-weight:500}.bad{color:#ab3f26;font-weight:650}.bar{height:17px;position:relative;width:240px;background:#fbe8e2;border-radius:3px}.fill{position:absolute;top:0;height:100%;background:#7ca7bc;border-radius:3px}.gap{position:absolute;top:-3px;width:3px;height:23px;background:#b93e2c;border:0;padding:0;border-radius:0}.topics{font:11px ui-monospace,monospace}.evidence{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.evidence article{padding:12px;border:1px solid #e0e7ef;border-radius:7px;font-size:12px;line-height:1.7}.evidence b{display:block}.evidence code{font-size:11px;overflow-wrap:anywhere}.evidence button{display:block;margin-top:8px;font-size:11px}.storyboard img{width:100%;border-radius:5px}.storyboard{grid-template-columns:repeat(3,minmax(0,1fr))}.story-row{margin:16px 0}details{border:1px solid #dce4ee;border-radius:7px;margin:12px 0;background:white}summary{padding:12px;font-weight:600;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,monospace;background:#f7f9fc;padding:14px;margin:0;max-height:650px;overflow:auto}.gap-note{font-size:11px;min-height:18px}.section-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.section-head span{margin-left:auto}.footer{font-size:12px;color:#677d95;margin-top:20px}body img{max-width:100%}@media(max-width:780px){.layout{grid-template-columns:1fr;padding:16px}aside{position:static}nav{display:flex;gap:7px;overflow:auto}nav button{min-width:155px}.videos{grid-template-columns:1fr}.evidence{grid-template-columns:1fr}.panel{padding:12px}.storyboard{gap:6px}header{padding:22px 16px}h1{font-size:23px}.path{font-size:10px}}
</style></head><body>
<header><small>REALOMNI OPEN · SOURCE REVIEW</small><h1>真实样本检查与原始视频</h1><p class="muted">查看每条 episode 为什么被保留或舍弃。底盘筛选已关闭；缺失检查和原始判定保持不变。</p><div id="stats" class="stats"></div><div class="links"><a href="overview.jpg" target="_blank">六条样本图片总览</a><a href="examples.json" download>完整预览 JSON</a><a href="all_results.jsonl" download>全部检查结果</a><a href="README.md">说明</a></div></header>
<div class="layout"><aside><small>真实 EPISODES</small><nav id="nav"></nav><p class="muted">目录名是源数据提供的任务类别，不作为任务成功或动作子任务标签。</p></aside><main id="main"></main></div>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script id="download-data" type="application/json">__DOWNLOAD_TEXTS__</script>
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#review-data').textContent),$=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,n=2)=>Number(x).toFixed(n),pretty=x=>JSON.stringify(x,null,2);
const labels={rejected:'整条舍弃',segmented:'已分割',error:'处理错误',checked:'检查通过',checking:'检查中'};
const reasonLabels={missing_camera_calibration:'相机标定缺失',timestamp_gap_or_disorder:'时间间隙超过阈值／时间倒序',missing_episode_prefix_or_suffix:'首尾覆盖未达到阈值',sequence_gap_or_disorder:'传感器采样序号不连续',missing_stream_or_samples:'必需流缺失',no_causal_observation:'缺少当前时刻之前的观测',incomplete_or_corrupt_video:'视频不完整或损坏'};
let selected=DATA.examples.find(x=>x.id===location.hash.slice(1))||DATA.examples[0],playing=false,position=0,last=null;
function details(title,value,open=false){return `<details ${open?'open':''}><summary>${esc(title)}</summary><pre>${esc(pretty(value))}</pre></details>`;}
function topicName(t){return t.replace('/robot0/','左 / ').replace('/robot1/','右 / ').replace('sensor/','').replace('vio/eef_pose','末端位姿').replace('camera0/compressed','相机').replace('magnetic_encoder','夹爪').replace('imu','IMU');}
function render(){playing=false;position=0;last=null;
$('#nav').innerHTML=DATA.examples.map(e=>`<button data-episode="${e.id}" class="${e.id===selected.id?'active':''}"><span class="badge">${esc(labels[e.status]||e.status)}</span><strong>${esc(e.title)}</strong><small>${esc(e.id)} · ${fmt(e.duration_s,1)} 秒</small></button>`).join('');
const e=selected,issues=e.reasons,cals=issues.filter(x=>x.code==='missing_camera_calibration');const mediaError=e.media_errors?.length?`<div class="notice"><b>源视频无法完整解码</b><p>本条仅展示质量检查证据，不播放残缺视频。解码错误是在预览阶段额外发现，原始拒绝判定保持不变。</p><pre>${esc(pretty(e.media_errors))}</pre></div>`:'';
$('#main').innerHTML=`<div class="section-head"><h2>${esc(e.title)}</h2><span class="badge">${esc(labels[e.status]||e.status)}</span></div><p class="path">${esc(e.episode_id)}</p><div class="links"><a href="${e.decision_file}" download>原始判定 JSON</a><a href="${e.id}/example.json" download>本条完整结果</a>${e.segmentation?`<a href="${e.id}/segmentation.json" download>完整分割 JSON</a>`:''}</div>
<div class="notice">${e.status==='rejected'?'这条 episode 未进入分割，也没有 guide、chunks 或训练样本。下面的双路视频仅供检查原始数据。':'分割结果来自已提交的整条 episode。'} ${cals.length?`另有 ${cals.length} 路相机标定缺失。`:''}</div>
<section class="panel"><h3>完整源视频 · 左右手相机</h3>${mediaError}<div class="videos">${e.cameras.map((c,i)=>`<figure><video id="camera-${i}" muted playsinline preload="metadata" src="${c.video}" poster="${c.poster}"></video><figcaption>${i===0?'左手':'右手'} · ${c.count} 帧 · 起始偏移 ${fmt(c.offset_s*1000)} ms</figcaption><div id="camera-note-${i}" class="gap-note"></div></figure>`).join('')}</div><div class="toolbar"><button id="play">播放双路</button><button id="restart">回到开头</button><input id="time" type="range" min="0" max="${e.duration_s}" step="0.001" value="0" aria-label="源时间轴"><span id="timer" class="timer"></span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><p class="muted">按原始纳秒时间戳的相对时间播放，未录制的首尾标为“无源帧”。预览缩小分辨率，没有补齐或生成训练帧。</p></section>
<section class="panel"><h3>各流覆盖范围与缺失判定</h3><p class="muted">蓝色表示已记录区间，浅红表示该流未覆盖的首尾，红标为已记录的间隙位置（每流最多显示前 20 个）。点击红标可定位视频。</p><div class="coverage"><table><thead><tr><th>数据流</th><th>时间覆盖</th><th>帧数</th><th>首部缺口 ms</th><th>尾部缺口 ms</th><th>首尾阈值 ms</th><th>异常间隔数</th><th>最大间隔／阈值 ms</th></tr></thead><tbody>${e.streams.map(s=>s.missing?`<tr><td>${esc(topicName(s.topic))}</td><td colspan="7">缺少数据流</td></tr>`:`<tr><td class="topics">${esc(topicName(s.topic))}</td><td><div class="bar"><div class="fill" style="left:${s.start_s/e.duration_s*100}%;width:${(s.end_s-s.start_s)/e.duration_s*100}%"></div>${s.gaps.map(g=>`<button class="gap" data-seek="${g.at_s}" style="left:${g.at_s/e.duration_s*100}%" title="${fmt(g.at_s,3)} s，间隔 ${fmt(g.duration_ms,3)} ms" aria-label="定位异常间隙"></button>`).join('')}</div></td><td>${s.count}</td><td class="${s.prefix_ms>s.boundary_limit_ms?'bad':''}">${fmt(s.prefix_ms)}</td><td class="${s.suffix_ms>s.boundary_limit_ms?'bad':''}">${fmt(s.suffix_ms)}</td><td>${fmt(s.boundary_limit_ms)}</td><td class="${s.gap_count?'bad':''}">${s.gap_count}</td><td>${fmt(s.max_gap_ms)} / ${fmt(s.gap_limit_ms)}</td></tr>`).join('')}</tbody></table></div></section>
<section class="panel"><h3>可核对的具体证据</h3><div class="evidence">${e.streams.filter(s=>s.gaps.length).flatMap(s=>s.gaps.slice(0,2).map(g=>`<article><b>${esc(topicName(s.topic))}</b>源帧 ${g.after_frame} → ${g.after_frame+1}<br>间隔 ${fmt(g.duration_ms,3)} ms<br>阈值 ${fmt(s.gap_limit_ms,3)} ms<button data-seek="${g.at_s}">定位 ${fmt(g.at_s,3)} 秒</button></article>`)).join('')}</div>${details('完整拒绝原因',issues)}${details('原始审计与检查范围',e.audit)}</section>
<section class="panel"><h3>源视频起／中／末帧</h3>${e.cameras.map((c,i)=>`<div class="story-row"><b>${i===0?'左手':'右手'}</b><div class="storyboard">${c.storyboard.map(s=>`<figure><a href="${s.path}" target="_blank"><img loading="lazy" src="${s.path}" alt="${esc(c.name)} ${s.role}"></a><figcaption>源帧 ${s.frame} · ${fmt(s.time_s,3)} 秒</figcaption></figure>`).join('')}</div></div>`).join('')}</section>
${e.segmentation?details('完整分割结果：16D guide 与 chunks',e.segmentation,true):'<section class="panel"><h3>分割结果</h3><p>无。整条质量检查未通过，参考 action、guide 和 chunks 未输出。</p></section>'}
${details('来源与可复核身份',{source:e.source_file,sha256:e.source_sha256,source_run:e.source_run,base_filter_enabled:DATA.base_filter_enabled})}<p class="footer">时间间隙和覆盖阈值的判定不等于任务成功判断。此页保留原始拒绝结果，便于复核阈值是否符合你的数据要求。</p>`;
$$('[data-episode]').forEach(b=>b.onclick=()=>{$$('video').forEach(v=>v.pause());selected=DATA.examples.find(x=>x.id===b.dataset.episode);history.replaceState(null,'','#'+selected.id);render();});
$$('[data-seek]').forEach(b=>b.onclick=()=>{playing=false;$('#play').textContent='播放双路';position=+b.dataset.seek;sync(true);$('#timer').scrollIntoView({block:'center',behavior:'smooth'});});
$('#time').oninput=ev=>{playing=false;$('#play').textContent='播放双路';position=+ev.target.value;sync(true);};
$('#play').onclick=()=>{playing=!playing;last=null;if(position>=selected.duration_s)position=0;$('#play').textContent=playing?'暂停':'播放双路';sync(true);};
$('#restart').onclick=()=>{position=0;sync(true);};$$('video').forEach(v=>v.onloadedmetadata=()=>sync(true));sync(true);if(!e.cameras.length){$('#play').disabled=true;$('#restart').disabled=true;$('#time').disabled=true;}
}
function sync(force=false){$('#time').value=position;$('#timer').textContent=`${fmt(position,3)} / ${fmt(selected.duration_s,3)} s`;selected.cameras.forEach((c,i)=>{const v=$('#camera-'+i);if(!v)return;const inside=position>=c.offset_s&&position<=c.end_s;v.style.opacity=inside?'1':'.18';$('#camera-note-'+i).textContent=inside?'源帧可用':position<c.offset_s?'本流尚未开始录制：无源帧':'本流已结束录制：无源帧';if(v.readyState>=1){let t=Math.max(0,Math.min(c.end_s-c.offset_s,position-c.offset_s));if(force||Math.abs(v.currentTime-t)>.15)v.currentTime=t;v.playbackRate=+$('#speed').value;if(playing&&inside)v.play().catch(()=>{});else v.pause();}});}
function tick(now){if(playing){if(last!==null)position=Math.min(selected.duration_s,position+(now-last)/1000*+$('#speed').value);if(position>=selected.duration_s){playing=false;$('#play').textContent='播放双路';}sync();}last=now;requestAnimationFrame(tick);}
$('#stats').innerHTML=`<span class="stat"><b>${DATA.inspected_episodes}</b>真实 episode 已检查</span><span class="stat"><b>${DATA.summary.rejected||0}</b>整条舍弃</span><span class="stat"><b>${DATA.summary.segmented||0}</b>已分割</span><span class="stat"><b>${DATA.preview_episodes}</b>条视频预览</span>`;
const DOWNLOADS=JSON.parse(document.querySelector('#download-data').textContent);
document.addEventListener('click',event=>{const link=event.target.closest('a[download]');if(!link)return;const href=link.getAttribute('href'),text=DOWNLOADS[href];if(typeof text!=='string')return;event.preventDefault();const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=href.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);});
render();requestAnimationFrame(tick);
</script></body></html>
