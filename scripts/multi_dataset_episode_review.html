<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC-130k / AgiBot / RoboTwin · 完整轨迹</title>
<style>__BASE_STYLE__
*{letter-spacing:0!important}.layout{grid-template-columns:250px minmax(0,1fr)}.filter{flex-wrap:wrap}.panel{border-radius:0;border:0;border-bottom:1px solid var(--border);box-shadow:none;background:transparent;padding:22px 0}.episode-nav{border-radius:7px}.badge.abc{background:#e8effe;color:#315fd3}.badge.agibot{background:#e0f3ed;color:#1d755e}.badge.robotwin{background:#fff0d6;color:#8d6419}.chain{max-height:405px;overflow:auto}.chain button{flex-shrink:0}.chain .verbs{font-size:12px}.timeline{height:32px;overflow:hidden}.timeline button{min-width:1px;font-size:9px;flex-basis:0;padding:0}.storyboard{grid-template-columns:repeat(3,minmax(0,1fr))}.observation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.videos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.videos.single{grid-template-columns:1fr}video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#090d12;max-height:460px}.videos.single video{aspect-ratio:auto}.caption{font-size:11px;color:var(--muted);margin:4px 0}.video-grid{grid-template-columns:minmax(0,1fr) 310px}.episode-id{overflow-wrap:anywhere}.data-column{min-width:0}.metric-row{flex-wrap:wrap}.full-json pre{max-height:550px;overflow:auto}.action-heading h4{font-size:16px;line-height:1.5;overflow-wrap:anywhere}.action-heading p{font-size:11px}.toolbar{flex-wrap:wrap}.toolbar button{width:36px;height:34px;padding:0;display:inline-grid;place-items:center;position:relative}.toolbar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}.toolbar button[title]:hover:after{content:attr(title);position:absolute;top:38px;left:0;white-space:nowrap;background:#243854;color:white;padding:4px 8px;font-size:11px;z-index:3}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.source-note{font-size:12px}.downloads{gap:14px}.action-summary{overflow-wrap:anywhere}.action-card{border-radius:7px}.chain button{border-radius:5px}.chain button.active{border-color:var(--color)}.seek-button{min-height:32px}.main{min-width:0}.top p{margin:0}.top{padding-top:22px!important;padding-bottom:20px!important}h1{font-size:26px}.tick-labels{gap:10px}.storyboard img{object-fit:contain}.detail-content pre{overflow-wrap:anywhere}.frame-info{font-size:11px;color:var(--muted);margin-top:9px}.mini-links a{white-space:nowrap}
@media(max-width:1150px){.video-grid{grid-template-columns:1fr}.chain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:230px}.chain button{min-width:0}.data-columns{grid-template-columns:1fr}}
@media(max-width:760px){.layout{display:block;padding:16px}.sidebar{position:static}.nav-items{display:flex;overflow:auto}.episode-nav{flex:0 0 200px}.sidebar .source-note,.sidebar .nav-label{display:none}.main{margin-top:18px}.videos{grid-template-columns:1fr}.videos video{max-height:250px}.observation-grid{grid-template-columns:1fr 1fr}.storyboard{grid-template-columns:1fr}.chain{grid-template-columns:1fr 1fr}.action-heading{align-items:flex-start;gap:10px}.action-heading h4{font-size:14px}.action-heading p{overflow-wrap:anywhere}.seek-button{flex-shrink:0}.toolbar .frame{flex-basis:100%}.data-columns{grid-template-columns:1fr}.tick-labels{font-size:9px}.meta .metric{font-size:11px}.top h1{font-size:22px;overflow-wrap:anywhere}.filter button{font-size:11px;padding:7px 9px}dialog img{max-width:85vw}.mini-links{gap:10px}}
.sidebar{max-height:calc(100dvh - 40px);display:flex;flex-direction:column}.sidebar .nav-items{overflow-y:auto;min-height:0;flex:1}.sidebar .filter,.sidebar .nav-label,.sidebar .source-note{flex-shrink:0}.sidebar .source-note{margin-top:12px}
@font-face{font-family:ReviewExtra;src:url('fonts/review-extra.woff');font-display:swap}@font-face{font-family:ReviewLatest;src:url('fonts/review-latest.woff');font-display:swap}@font-face{font-family:ReviewAgiBot;src:url('fonts/review-agibot.woff');font-display:swap}body{font-family:Inter,"PingFang SC","Microsoft YaHei",ReviewCJK,ReviewLatest,ReviewAgiBot,ReviewExtra,system-ui,sans-serif}pre,.toolbar .frame,.tick-labels{font-family:ui-monospace,SFMono-Regular,Consolas,ReviewCJK,ReviewLatest,ReviewAgiBot,ReviewExtra,monospace}
@media(max-width:760px){.sidebar{max-height:none;display:block}.sidebar .nav-items{overflow-x:auto;overflow-y:hidden}.sidebar .source-note{display:none}}
</style></head><body>
<header class="top"><div class="eyebrow">EPISODE REVIEW · 2026-10-20</div><h1>ABC-130k / AgiBot / RoboTwin</h1><div class="stats" id="stats"></div><div class="downloads"><a href="overview.jpg" target="_blank">轨迹总览</a><a href="complete_episodes.json" download>完整数据</a><a href="SELECTION.json" target="_blank">样本来源</a><a href="VALIDATION.json" target="_blank">数据校验</a></div></header>
<div class="layout"><aside class="sidebar"><div class="filter"><button data-filter="all" class="active">全部 12</button><button data-filter="ABC-130k">ABC 4</button><button data-filter="AgiBot">AgiBot 4</button><button data-filter="RoboTwin">RoboTwin 4</button></div><div class="nav-label">完整 EPISODES</div><nav id="nav" class="nav-items" aria-label="轨迹选择"></nav><div class="source-note note"><b>数据版本</b><p>ABC · softchunks 2026-10-13<br>AgiBot · run_v1 2026-10-15<br>RoboTwin · aligned_v5 2026-10-17</p></div></aside><main class="main" id="main"></main></div>
<dialog id="image-dialog"><button id="close-image" aria-label="关闭大图">×</button><img id="large-image" alt="观测大图"></dialog>
<script id="episode-data" type="application/json">__EPISODE_DATA__</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('episode-data').textContent),$=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const COLORS=['#3b82f6','#8b5cf6','#d19a23','#10a78f','#d76883','#6285a8'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
const icons={play:'<path d="m8 5 11 7-11 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',prev:'<path d="M5 5v14m14-14-9 7 9 7z"/>',next:'<path d="M19 5v14M5 5l9 7-9 7z"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
let selected=DATA.episodes[0],filter='all',playing=false,rate=1;
const videos=()=>$$('#main video');
const datasetClass=e=>({'ABC-130k':'abc',AgiBot:'agibot',RoboTwin:'robotwin'}[e.dataset]);
const badge=e=>`<span class="badge ${datasetClass(e)}">${esc(e.dataset)} · ${esc(e.source.split)}</span>`;
const title=e=>e.task.split('|')[0].trim();
function block(name,value,open=false,cls='raw'){return `<details ${open?'open':''} class="${cls}"><summary>${esc(name)}</summary><div class="detail-content"><button class="copy">复制</button><pre>${esc(pretty(value))}</pre></div></details>`;}
function figure(path,label){return `<figure><img class="zoom" loading="lazy" src="${esc(path)}" alt="${esc(label)}"><figcaption>${esc(label)}</figcaption></figure>`;}
function renderNav(){$('#nav').innerHTML=DATA.episodes.filter(e=>filter==='all'||e.dataset===filter).map(e=>`<button class="episode-nav ${e.id===selected.id?'active':''}" data-episode="${e.id}">${badge(e)}<span class="name">${esc(title(e))}</span><small>${e.frame_count} action rows · ${e.segments.length} 段</small></button>`).join('');$$('[data-episode]').forEach(b=>b.onclick=()=>selectEpisode(b.dataset.episode));}
function card(e,s,i){const row=e.vlm[i],meta=e.vlm_metadata[i];return `<article class="action-card" id="action-${i}" style="--color:${COLORS[i%COLORS.length]}"><div class="action-heading"><div><h4>A${String(i+1).padStart(2,'0')} · ${esc(s.primary_action_verb)}</h4><p>action row ${s.start_frame}–${s.end_frame} · ${s.valid_action_rows} rows · ${s.num_chunks} chunks</p></div><button class="seek-button" data-seek="${i}" aria-label="定位片段 ${i+1}">定位</button></div><div class="action-body"><p class="action-summary">${esc(s.sub_task)}</p><div class="storyboard">${e.storyboard[i].map((f,j)=>figure(f.path,['起始','中间','结束'][j]+` · frame ${f.frame}`)).join('')}</div><div class="data-columns"><section class="data-column"><div class="column-title"><span class="tag">VLM</span>训练输入 / 输出</div>${block('SYSTEM',row.messages[0].content,false,'message')}${block('USER',row.messages[1].content,true,'message')}<details open class="student-images"><summary>输入观测 · ${row.images.length} 张</summary><div class="detail-content observation-grid">${e.observations[i].map((p,j)=>figure(p,meta.image_roles[j])).join('')}</div></details>${block('ASSISTANT',row.messages[2].content,true,'message')}${block('完整训练 JSON',row,false,'raw full-json')}${block('Metadata',meta)}</section><section class="data-column"><div class="column-title"><span class="tag vla">VLA</span>${e.state_layout.length}D 动作</div><div class="metric-row"><span class="metric">${s.valid_action_rows} valid rows</span><span class="metric">${s.padding_rows_if_chunked} padding slots</span></div>${block('完整动作片段',s,true,'vla-segment')}${s.primitive_segments?block('原语与合并来源',s.primitive_segments):''}</section></div></div></article>`;}
function render(){const e=selected;renderNav();$('#main').innerHTML=`<div class="episode-header">${badge(e)}<h2>${esc(title(e))}</h2><p class="task">${esc(e.task)}</p><div class="episode-id">${esc(e.source_episode_id)}</div><div class="meta"><span class="metric">${e.frame_count} action rows</span><span class="metric">${e.segments.length} 个动作</span><span class="metric">${e.state_layout.length}D</span><span class="metric">${e.camera_names.length} 个相机</span><span class="metric">${esc(e.version)}</span></div><div class="mini-links">${e.downloads.map(name=>`<a href="${e.directory}/${name}" download>${({'vlm.jsonl':'VLM JSONL','vla.json':'VLA JSON','vlm_metadata.jsonl':'Metadata','trajectory.json':'完整轨迹','segmentation.json':'动作分段','native.npz':'原生动作','export/reference.npz':'参考动作','all_training_rows.jsonl':'全部增强训练行','source.json':'来源映射'}[name]||name)}</a>`).join('')}</div></div><section class="panel"><div class="video-grid"><div><div class="videos ${e.videos.length===1?'single':''}">${e.videos.map(v=>`<div><video muted playsinline preload="metadata" src="${esc(v.path)}" ${e.videos.length===1?`poster="${esc(e.poster)}"`:''}></video><div class="caption">${esc(v.name)}</div></div>`).join('')}</div><div class="toolbar"><button id="play" title="播放" aria-label="播放">${icon('play')}</button><button id="prev-frame" title="上一帧" aria-label="上一帧">${icon('prev')}</button><button id="next-frame" title="下一帧" aria-label="下一帧">${icon('next')}</button><select id="speed" aria-label="播放速度">${[.25,.5,1,1.5,2].map(r=>`<option value="${r}" ${r===rate?'selected':''}>${r}×</option>`).join('')}</select><span class="frame" id="frame-label"></span></div><input id="scrubber" class="scrubber" aria-label="轨迹帧" type="range" min="0" max="${e.display_timestamps.length-1}" value="0" step="1"><div class="frame-info">${esc(e.time_basis)}<span id="media-error"></span></div></div><div><h3>动作序列 · ${e.segments.length} 段</h3><div class="chain">${e.segments.map((s,i)=>`<button data-seek="${i}" data-active="${i}" style="--color:${COLORS[i%COLORS.length]}"><b>A${i+1}</b><span class="verbs">${esc(s.sub_task)}<br><small>row ${s.start_frame}–${s.end_frame} · ${s.num_chunks} chunks</small></span></button>`).join('')}</div></div></div><div class="timeline" aria-label="动作时间轴">${e.segments.map((s,i)=>`<button data-seek="${i}" data-active="${i}" title="A${i+1}: ${esc(s.sub_task)}" style="--color:${COLORS[i%COLORS.length]};--span:${s.valid_action_rows}">${i+1}</button>`).join('')}</div><div class="tick-labels"><span>row 0</span><span>完整覆盖</span><span>row ${e.frame_count-1}</span></div></section><div class="legend"><h3>全部动作</h3><div class="section-toolbar"><button id="open-messages">展开对话</button><button id="open-all">展开数据</button><button id="close-raw">收起数据</button></div></div>${e.segments.map((s,i)=>card(e,s,i)).join('')}<section class="panel">${block('Episode 校验',e.checks)}${block('全部训练样本',e.vlm)}${block('全部动作片段',e.segments)}</section>`;bind();}
function frameAt(t){const a=selected.display_timestamps;let l=0,r=a.length;while(l<r){const m=(l+r)>>1;if(a[m]<=t+1e-6)l=m+1;else r=m;}return Math.max(0,l-1);}
function currentFrame(){return frameAt(videos()[0]?.currentTime||0);}
function updateFrame(n=currentFrame()){$('#scrubber').value=n;$('#frame-label').textContent=`frame ${n} / ${selected.display_timestamps.length-1} · 源 t=${selected.timestamps[n].toFixed(3)}s`;const action=Math.min(n,selected.frame_count-1),i=selected.segments.findIndex(s=>s.start_frame<=action&&s.end_frame>=action);$$('[data-active]').forEach(b=>b.classList.toggle('active',+b.dataset.active===i));}
function pause(){playing=false;videos().forEach(v=>v.pause());if($('#play')){$('#play').innerHTML=icon('play');$('#play').title='播放';$('#play').setAttribute('aria-label','播放');}}
function setFrame(n){pause();n=Math.max(0,Math.min(selected.display_timestamps.length-1,n));videos().forEach(v=>v.currentTime=selected.display_timestamps[n]+0.00001);updateFrame(n);}
async function play(){if(videos()[0]?.ended)setFrame(0);playing=true;$('#play').innerHTML=icon('pause');$('#play').title='暂停';$('#play').setAttribute('aria-label','暂停');try{await Promise.all(videos().map(v=>v.play()));}catch(error){pause();$('#media-error').textContent=error.message;}}
function bind(){videos().forEach(v=>{v.playbackRate=rate;v.addEventListener('loadedmetadata',()=>updateFrame());v.addEventListener('error',()=>{$('#media-error').textContent='视频加载失败';});});$('#play').onclick=()=>playing?pause():play();$('#scrubber').oninput=e=>setFrame(+e.target.value);$('#prev-frame').onclick=()=>setFrame(currentFrame()-1);$('#next-frame').onclick=()=>setFrame(currentFrame()+1);$('#speed').onchange=e=>{rate=+e.target.value;videos().forEach(v=>v.playbackRate=rate);};$$('[data-seek]').forEach(b=>b.onclick=()=>setFrame(selected.segments[+b.dataset.seek].start_frame));$('#open-messages').onclick=()=>$$('details.message').forEach(d=>d.open=true);$('#open-all').onclick=()=>$$('#main details').forEach(d=>d.open=true);$('#close-raw').onclick=()=>$$('#main details').forEach(d=>d.open=false);$$('img.zoom').forEach(im=>im.onclick=()=>{$('#large-image').src=im.src;$('#image-dialog').showModal();});$$('.copy').forEach(b=>b.onclick=async()=>{const text=b.parentElement.querySelector('pre').textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();}b.textContent='已复制';}catch{b.textContent='复制失败';}});bindDownloads();updateFrame(0);}
function bindDownloads(){const values={'complete_episodes.json':JSON.stringify(DATA,null,2),[selected.directory+'/vlm.jsonl']:selected.vlm_jsonl_text};$$('a[download]').forEach(a=>{const path=a.getAttribute('href');if(!(path in values))return;a.onclick=event=>{event.preventDefault();const url=URL.createObjectURL(new Blob([values[path]],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download=path.split('/').pop();link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};});}
function selectEpisode(id){const e=DATA.episodes.find(e=>e.id===id);if(!e)return;pause();selected=e;history.replaceState(null,'','#'+id);render();}
function tick(){const vs=videos(),v=vs[0];if(playing&&v){updateFrame();vs.slice(1).forEach(other=>{if(!other.seeking&&!v.seeking&&Math.abs(other.currentTime-v.currentTime)>.12)other.currentTime=v.currentTime;});if(v.ended)pause();}requestAnimationFrame(tick);}
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));if(filter!=='all'&&selected.dataset!==filter)selectEpisode(DATA.episodes.find(e=>e.dataset===filter).id);else renderNav();});
$('#stats').innerHTML=['ABC-130k','AgiBot','RoboTwin'].map(d=>`<span class="stat"><b>4</b>${d}</span>`).join('')+`<span class="stat"><b>${DATA.validation.planner_rows}</b>动作片段</span>`;
$('#close-image').onclick=()=>$('#image-dialog').close();$('#image-dialog').onclick=e=>{if(e.target.id==='image-dialog')$('#image-dialog').close();};
try{selected=DATA.episodes.find(e=>e.id===decodeURIComponent(location.hash.slice(1)))||selected;render();tick();}catch(error){$('#main').textContent=error.message;throw error;}
</script></body></html>
