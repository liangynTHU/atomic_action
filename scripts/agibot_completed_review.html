<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgiBot · 已生成数据可视化</title>
<style>
@font-face{font-family:review;src:url(review.woff);font-display:swap}
:root{color-scheme:dark;--bg:#0c1320;--panel:#142033;--line:#2c3b51;--text:#e7eef8;--muted:#9dafc6;--accent:#77dfc6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px review,system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}a{color:var(--accent)}header{padding:25px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px}h1{font-size:26px;margin:4px 0}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0 0 12px}p{margin:7px 0;color:var(--muted)}.total{text-align:right;white-space:nowrap;color:var(--muted)}.total b{font-size:23px;color:var(--accent)}.layout{display:grid;grid-template-columns:256px minmax(0,1fr)}aside{padding:20px 16px;border-right:1px solid var(--line)}.ep{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:14px;text-align:left;color:var(--text)}.ep.active{border-color:var(--accent);background:#193d40}.ep strong{font-size:16px}.ep small{display:block;color:var(--muted);overflow-wrap:anywhere;font-size:11px;margin-top:5px}main{padding:22px 28px;min-width:0}.intro{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{color:var(--accent);border:1px solid #35615d;border-radius:20px;padding:4px 12px;font-size:12px;white-space:nowrap}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:17px 0}.stat{padding:9px 18px;border:1px solid var(--line);border-radius:8px;min-width:120px;color:var(--muted);font-size:12px}.stat b{display:block;font-size:23px;color:var(--text)}.videos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#050a10;border-radius:8px}.caption{font-size:12px;color:var(--muted);margin:5px 0}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.action,select{border:1px solid #427470;background:#193e40;color:var(--text);border-radius:7px;padding:7px 12px}.secondary{background:var(--panel);border-color:var(--line)}#time{flex:1;min-width:120px;accent-color:var(--accent)}#clock{font-variant-numeric:tabular-nums;font-size:12px;min-width:112px}#frame{color:var(--muted);font-size:12px}.timeline-row{display:flex;gap:10px;align-items:center;margin:8px 0}.timeline-label{width:30px;color:var(--muted);font-size:12px;flex-shrink:0}.timeline{display:flex;gap:2px;height:29px;flex:1;min-width:0}.seg{border:0;padding:0;min-width:1px;color:#10202c;border-radius:3px;overflow:hidden;font-size:10px;position:relative}.seg.active{outline:2px solid white;outline-offset:1px;z-index:1}.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:12px 0}.legend i{width:9px;height:9px;display:inline-block;border-radius:2px;margin-right:5px}.chart{width:100%;height:96px;display:block;background:#111d2d;border-radius:8px;cursor:crosshair}.muted{font-size:12px;color:var(--muted)}.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:18px}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.nav{display:flex;gap:6px}.label{color:var(--text);font-size:15px;margin:12px 0 15px}.pill{display:inline-block;padding:3px 9px;border:1px solid #40546c;border-radius:16px;color:var(--muted);font-size:12px;margin:7px 5px 0 0}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shot{padding:0;background:transparent;border:0;color:var(--muted);text-align:left;min-width:0}.shot img{display:block;width:100%;border-radius:6px}.shot span{display:block;font-size:11px;padding-top:5px}.guide{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:normal}.guide td{font-variant-numeric:tabular-nums;white-space:nowrap}details{margin-top:14px;border:1px solid var(--line);padding:12px;border-radius:8px}summary{cursor:pointer;color:#c3d3e8}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto;font:12px/1.7 ui-monospace,monospace;color:#c9d7e8}.messages details{background:#0f1a2b}.student-images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.downloads{display:flex;gap:15px;flex-wrap:wrap;margin:18px 0}.table-wrap{overflow:auto;margin-top:18px}.segment-table{min-width:600px}.segment-table tr[data-row]{cursor:pointer}.segment-table tr.active,.segment-table tr[data-row]:hover{background:#1c3344}.subtask-cell{max-width:480px}.path{overflow-wrap:anywhere}.error{background:#492526;color:#ffcccb;padding:12px;border-radius:8px;margin:10px 0}dialog{width:min(1200px,96vw);max-height:94vh;background:#111d2d;border:1px solid #50627b;border-radius:10px;color:var(--text)}dialog::backdrop{background:#000b}dialog img{display:block;width:100%;margin:12px 0}.foot{padding:15px 0;color:var(--muted);font-size:12px}
@media(max-width:850px){header{padding:20px;flex-wrap:wrap}.total{text-align:left}.layout{grid-template-columns:1fr}aside{display:flex;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;max-width:100vw;padding:14px}.ep{min-width:210px;max-width:230px;margin:0}main{padding:18px}.stats{gap:8px}.stat{min-width:100px;padding:8px 12px}.videos{grid-template-columns:1fr}.videos video{max-height:340px}.intro{align-items:flex-start;flex-wrap:wrap}.detail{padding:14px}.detail-top{flex-wrap:wrap}.shots{grid-template-columns:1fr}.student-images{grid-template-columns:1fr}h1{font-size:23px}#time{flex-basis:100%;order:5}.controls{gap:7px}.action,select{padding:6px 9px}.subtask-cell{max-width:320px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">AGIBOT / EPISODE REVIEW</div><h1>已生成数据 · 完整轨迹可视化</h1><p>三路同步视频 · 双臂动作时间轴 · 原始子任务标注 · 16D guide</p></div><div id="total" class="total"></div></header>
<div class="layout"><aside id="episodes" aria-label="选择样本"></aside><main id="main"></main></div>
<dialog id="lightbox"><button class="action secondary" id="close-image">关闭大图</button><img id="large-image" alt="观测关键帧大图"><div id="image-caption"></div></dialog>
<script>
'use strict';
const DATA=__DATA__;
const titles={task_362:'叠短裤',task_424:'清理台面垃圾',task_372:'超市装袋',task_388:'超市取货'};
const colors={move:'#63cdbc',turn:'#b79ae6',lift:'#83bdf0',lower:'#e9bd78',open_gripper:'#e694b7',close_gripper:'#ec8d78',still:'#76879c'};
const actionNames={move:'移动',turn:'旋转',lift:'抬升',lower:'下降',open_gripper:'张开夹爪',close_gripper:'闭合夹爪',still:'保持'};
const cameraNames={head:'头部视角',hand_left:'左手视角',hand_right:'右手视角'};
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=e=>titles[e.episode_id.split('/')[0]]||e.task.split('|')[0].trim();
let current=null,selected=-1,playing=false,generation=0,rate=1;
const videos=()=>Array.from(document.querySelectorAll('video'));
const details=(name,value)=>`<details><summary>${esc(name)}</summary><pre>${esc(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre></details>`;
$('total').innerHTML=`<b>${DATA.examples.length}</b> 条完整 episode<br><b>${DATA.examples.reduce((n,e)=>n+e.segments.length,0)}</b> 个动作片段`;
$('episodes').innerHTML=DATA.examples.map((e,i)=>`<button class="ep" data-episode="${i}"><strong>${esc(title(e))}</strong><small>${esc(e.episode_id)}</small><small>${e.duration_s.toFixed(1)} 秒 · ${e.segments.length} 段</small></button>`).join('');
document.querySelectorAll('[data-episode]').forEach(b=>b.onclick=()=>showEpisode(+b.dataset.episode));
function showEpisode(i){
 pause();generation++;current=DATA.examples[i];selected=-1;const e=current;
 document.querySelectorAll('.ep').forEach((b,j)=>b.classList.toggle('active',i===j));
 $('main').innerHTML=`<div class="intro"><div><h2>${esc(title(e))}</h2><div class="muted">${esc(e.episode_id)}</div></div><span class="badge">已完成标注与导出</span></div><p>${esc(e.task)}</p>
 <div class="stats"><div class="stat"><b>${e.duration_s.toFixed(1)} s</b>完整视频</div><div class="stat"><b>${e.source_rows.toLocaleString()}</b>实测状态</div><div class="stat"><b>${e.reference_rows.toLocaleString()}</b>参考动作</div><div class="stat"><b>${e.segments.length}</b>动作片段</div></div>
 <div class="videos">${e.cameras.map(c=>`<div><video muted playsinline preload="auto" src="${esc(c.video)}" aria-label="${cameraNames[c.name]}"></video><div class="caption">${cameraNames[c.name]} · ${esc(c.name)}</div></div>`).join('')}</div><div id="media-error" role="alert"></div>
 <div class="controls"><button class="action" id="play">播放</button><button class="action secondary" id="previous-frame" aria-label="上一帧">−1 帧</button><button class="action secondary" id="next-frame" aria-label="下一帧">+1 帧</button><input id="time" aria-label="视频进度" type="range" min="0" max="${e.reference_rows/DATA.fps}" step="${1/DATA.fps}" value="0"><span id="clock"></span><select id="speed" aria-label="播放速度">${[.5,1,1.5,2].map(v=>`<option value="${v}" ${v===rate?'selected':''}>${v}×</option>`).join('')}</select><span id="frame"></span></div>
 ${['left','right'].map((arm,a)=>`<div class="timeline-row"><span class="timeline-label">${a?'右臂':'左臂'}</span><div class="timeline">${e.segments.map((s,j)=>`<button class="seg" data-segment="${j}" style="flex:${s.valid_action_rows};background:${colors[s[arm+'_action']]||colors.move}" title="片段 ${j+1} · ${actionNames[s[arm+'_action']]} · ${s.start_s.toFixed(2)}–${s.end_s.toFixed(2)} s" aria-label="${a?'右臂':'左臂'}片段 ${j+1}">${j+1}</button>`).join('')}</div></div>`).join('')}
 <div class="legend">${Object.entries(colors).map(([k,v])=>`<span><i style="background:${v}"></i>${actionNames[k]}</span>`).join('')}</div><svg class="chart" id="grippers" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-label="双臂实测夹爪开度曲线"></svg><p class="muted">夹爪开度：绿色左手、紫色右手。点击色块或曲线跳转；点击关键帧查看大图。</p>
 <div id="segment-detail"></div>
 <div class="downloads"><a download href="${e.id}/export/vlm.jsonl">完整 VLM JSONL</a><a download href="${e.id}/export/vla.json">完整 VLA JSON</a><a download href="${e.id}/export/reference.npz">16D 实测轨迹</a><a download href="${e.id}/export/VALIDATION.json">导出校验</a><a download href="${e.id}/decision.json">筛选判定</a></div>
 <div class="table-wrap"><table class="segment-table"><thead><tr><th>片段</th><th>时间 / 秒</th><th>左臂 / 右臂</th><th>chunks</th><th>原始子任务文本</th></tr></thead><tbody>${e.segments.map((s,j)=>`<tr data-row="${j}"><td>${j+1}</td><td>${s.start_s.toFixed(2)}–${s.end_s.toFixed(2)}</td><td>${actionNames[s.left_action]} / ${actionNames[s.right_action]}</td><td>${s.num_chunks}</td><td class="subtask-cell">${esc(s.sub_task)}</td></tr>`).join('')}</tbody></table></div>
 ${details('16D action / guide 定义',DATA.contract)}${details('原始运行的学生 system prompt',DATA.student_system)}${details('原始运行的标注 system prompt',DATA.teacher_system)}${details('完整筛选检查',e.checks)}
 <details><summary>数据来源</summary><p class="path">${esc(e.source_export)}</p><p class="muted">页面使用已提交导出的原始标注和训练消息。下载的原始 VLM JSONL 保留共享目录图片路径；页面预览图片已随包提供。</p></details><div class="foot">${esc(e.episode_id)} · ${DATA.fps} fps · 可离线打开</div>`;
 document.querySelectorAll('[data-segment],[data-row]').forEach(b=>b.onclick=()=>{pause();showSegment(+(b.dataset.segment??b.dataset.row));seek(current.segments[selected].start_s)});
 document.querySelectorAll('a[download]').forEach(a=>a.onclick=event=>{event.preventDefault();const name=a.getAttribute('href').split('/').pop();const bytes=Uint8Array.from(atob(e.downloads[name].base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const link=document.createElement('a');link.href=url;link.download=e.episode_id.replace('/','_')+'_'+name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
 $('time').oninput=()=>seek(+$('time').value);$('play').onclick=()=>playing?pause():play();
 $('previous-frame').onclick=()=>{pause();seek((videos()[0]?.currentTime||0)-1/DATA.fps)};$('next-frame').onclick=()=>{pause();seek((videos()[0]?.currentTime||0)+1/DATA.fps)};
 $('speed').onchange=()=>{rate=+$('speed').value;videos().forEach(v=>v.playbackRate=rate)};
 videos().forEach(v=>{v.muted=true;v.playbackRate=rate;v.onerror=()=>{$('media-error').innerHTML='<div class="error">视频加载失败，请保留 index.html 与媒体目录的相对位置。</div>'}});
 const sig=e.signal;$('grippers').innerHTML=`<line x1="0" y1="85" x2="1000" y2="85" stroke="#344359"/>`+['left_gripper','right_gripper'].map((k,a)=>`<polyline fill="none" stroke="${a?'#b79ae6':'#63cdbc'}" stroke-width="2" points="${sig[k].map((v,j)=>`${sig.frames[j]/e.reference_rows*1000},${85-v*70}`).join(' ')}"/>`).join('')+'<line id="cursor" x1="0" x2="0" y1="0" y2="100" stroke="#fff" opacity=".7"/>';
 $('grippers').onclick=event=>{const rect=$('grippers').getBoundingClientRect();pause();seek((event.clientX-rect.left)/rect.width*e.reference_rows/DATA.fps)};
 showSegment(0);update(0);
}
function showSegment(i){
 if(i===selected)return;selected=i;const s=current.segments[i];
 document.querySelectorAll('[data-segment]').forEach(b=>b.classList.toggle('active',+b.dataset.segment===i));document.querySelectorAll('[data-row]').forEach(b=>b.classList.toggle('active',+b.dataset.row===i));
 $('segment-detail').innerHTML=`<section class="detail"><div class="detail-top"><h3>片段 ${i+1} / ${current.segments.length} · ${s.start_s.toFixed(2)}–${s.end_s.toFixed(2)} s</h3><div class="nav"><button id="prev-segment" class="action secondary" ${i===0?'disabled':''}>上一段</button><button id="next-segment" class="action secondary" ${i===current.segments.length-1?'disabled':''}>下一段</button></div></div><span class="pill">动作行 ${s.start_frame}–${s.end_frame}</span><span class="pill">${s.valid_action_rows} 条动作</span><span class="pill">${s.num_chunks} chunks</span><span class="pill">目标观测帧 ${s.target_observation_frame}</span><p class="label" id="subtask">${esc(s.sub_task)}</p>
 <div class="shots">${s.shots.map((x,j)=>`<div><button class="shot" data-image="${esc(x.path)}" data-caption="${['起始观测','中间观测','目标观测'][j]} · 帧 ${x.frame}"><img src="${esc(x.path)}" alt="${['起始','中间','目标'][j]}三路观测"><span>${['起始观测','中间观测','目标观测'][j]} · 帧 ${x.frame}</span></button><button class="action secondary" data-seek="${x.frame/DATA.fps}" style="margin-top:6px;font-size:11px">跳到 ${ (x.frame/DATA.fps).toFixed(2)} s</button></div>`).join('')}</div>
 <details><summary>16D guide 数值</summary><p class="muted">完整定义见下方 action / guide。显示值保留到小数点后 5 位，原始精度保留在 JSON 中。</p><div class="guide"><table><thead><tr><th>手臂</th>${['Δx','Δy','Δz','Δqw','Δqx','Δqy','Δqz','Δgripper'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[0,1].map(a=>`<tr><td>${a?'右臂':'左臂'}</td>${s.guide_action.slice(a*8,a*8+8).map(v=>`<td>${v.toFixed(5)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>
 <details class="messages" id="training-messages"><summary>本段训练消息 · system / user / assistant</summary>${s.messages.map(m=>details(m.role,m.content)).join('')}</details>
 <details id="student-observations"><summary>学生输入观测 · ${s.student_images.length} 张</summary><div class="student-images">${s.student_images.map(x=>`<button class="shot" data-image="${esc(x.path)}" data-caption="${esc(x.camera)} · ${esc(x.role)} · 帧 ${x.observation_frame}"><img loading="lazy" src="${esc(x.path)}" alt="${esc(x.camera)} 输入观测"><span>${cameraNames[x.camera]} · ${esc(x.role)} · 帧 ${x.observation_frame}</span></button>`).join('')}</div></details>
 ${details('完整分段 JSON 与原语来源',Object.fromEntries(Object.entries(s).filter(([k])=>!['messages','student_images','shots','start_s','end_s'].includes(k))))}</section>`;
 $('prev-segment').onclick=()=>{pause();seek(current.segments[Math.max(0,selected-1)].start_s)};$('next-segment').onclick=()=>{pause();seek(current.segments[Math.min(current.segments.length-1,selected+1)].start_s)};
 document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{pause();seek(+b.dataset.seek)});
 document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{$('large-image').src=b.dataset.image;$('image-caption').textContent=b.dataset.caption;$('lightbox').showModal()});
}
function update(t){if(!current)return;$('time').value=t;$('clock').textContent=`${t.toFixed(2)} / ${(current.reference_rows/DATA.fps).toFixed(2)} s`;$('frame').textContent=`帧 ${Math.min(current.reference_rows,Math.round(t*DATA.fps))}`;const x=Math.max(0,Math.min(1000,t*DATA.fps/current.reference_rows*1000));$('cursor').setAttribute('x1',x);$('cursor').setAttribute('x2',x);const frame=Math.min(current.reference_rows-1,Math.floor(t*DATA.fps+1e-5));const i=current.segments.findIndex(s=>frame>=s.start_frame&&frame<=s.end_frame);if(i>=0)showSegment(i)}
function seek(t){t=Math.max(0,Math.min(current.reference_rows/DATA.fps,t));videos().forEach(v=>v.currentTime=t);update(t)}
function pause(){playing=false;videos().forEach(v=>v.pause());if($('play'))$('play').textContent='播放'}
async function play(){const token=generation;if(videos()[0]?.ended)seek(0);playing=true;$('play').textContent='暂停';try{await Promise.all(videos().map(v=>v.play()))}catch(error){if(token===generation&&playing){pause();$('media-error').innerHTML=`<div class="error">${esc(error.message)}</div>`}}}
function tick(){const vs=videos(),v=vs[0];if(playing&&v){update(v.currentTime);vs.slice(1).forEach(other=>{if(!other.seeking&&!v.seeking&&Math.abs(other.currentTime-v.currentTime)>.12)other.currentTime=v.currentTime});if(v.ended)pause()}requestAnimationFrame(tick)}
$('close-image').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};
document.addEventListener('keydown',event=>{if(!current||$('lightbox').open||/INPUT|SELECT|TEXTAREA|BUTTON/.test(event.target.tagName))return;if(event.code==='Space'){event.preventDefault();playing?pause():play()}else if(event.code==='ArrowRight'||event.code==='ArrowLeft'){event.preventDefault();pause();seek((videos()[0]?.currentTime||0)+(event.code==='ArrowRight'?1:-1)/DATA.fps)}});
if(DATA.examples.length)showEpisode(0);tick();
</script>
</body></html>
