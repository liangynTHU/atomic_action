<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealOmni · 首尾裁剪后的原子动作分割</title>
<style>
@font-face{font-family:ReviewCJK;src:url('review-cjk.woff');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#213650;font:14px ReviewCJK,system-ui,sans-serif}
a{color:#315fd3;text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button,summary{cursor:pointer}
button,select{border:1px solid #d4dfe9;border-radius:7px;background:white;color:inherit;padding:7px 11px}
button:focus-visible,a:focus-visible{outline:3px solid #97b6f0;outline-offset:2px}p{line-height:1.7}h1,h2,h3,h4{margin:0 0 12px}h1{font-size:28px}h2{font-size:24px}h3{font-size:16px}h4{font-size:14px}
header{background:white;border-bottom:1px solid #dce5ee;padding:28px 4vw}.eyebrow{color:#7890a7;font-size:11px;letter-spacing:1.4px;margin-bottom:10px}
.muted{color:#6c8096;font-size:12px}.stats,.links,.metrics{display:flex;gap:10px;flex-wrap:wrap}.stats{margin:18px 0 15px}.stat{background:#eff4fa;border-radius:7px;padding:10px 14px;font-size:12px}.stat b{font-size:21px;margin-right:7px}.links{gap:16px;font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1750px;padding:24px 4vw;gap:24px;margin:auto}aside{position:sticky;top:20px;align-self:start;min-width:0}main{min-width:0}
nav button{display:block;width:100%;text-align:left;padding:12px;margin:8px 0}nav button.active{border-color:#85a5dd;background:#eef4ff}nav strong{display:block;margin:6px 0}nav small{font-size:11px;color:#68809a}
.badge{font-size:11px;border-radius:5px;padding:4px 7px;display:inline-block;background:#e4f3eb;color:#217555}.badge.warn{background:#fff2de;color:#a56b22}.path{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:#6e8299;line-height:1.6}
.panel,.card{border:1px solid #dae4ee;border-radius:11px;background:white;margin:17px 0;padding:18px}.notice{border-left:3px solid #5b9d80;background:#eaf5ef;padding:12px 15px;line-height:1.8;font-size:13px;margin:16px 0}.metric{background:#f2f6fa;padding:6px 10px;border-radius:5px;font-size:12px}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0}video{width:100%;display:block;max-height:335px;background:#0e1928;border-radius:7px}figcaption{font-size:11px;color:#6a8196;line-height:1.6;margin-top:5px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input[type=range]{flex:1;min-width:120px;accent-color:#4779b9}.timer{font:12px ReviewCJK,ui-monospace,monospace}.cropbar{height:25px;position:relative;background:#e5e9ee;border-radius:5px;overflow:hidden}.cropkept{height:100%;position:absolute;background:#62a18a;color:white;text-align:center;font-size:11px;line-height:25px}.ticks{display:flex;justify-content:space-between;font-size:11px;color:#71869a;margin-top:6px}
.timeline{display:flex;gap:2px;height:32px;margin:14px 0}.timeline button{min-width:3px;padding:0;flex:var(--span);border:0;background:var(--color);color:white;font-size:10px;border-radius:3px}.timeline button.active{outline:2px solid #213650;outline-offset:2px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:250px;overflow:auto;margin-top:12px}.actions button{text-align:left;font-size:11px;border-left:3px solid var(--color)}.actions button.active{background:#edf3ff;border-color:#82a5df}
.chart{width:100%;height:135px;display:block}.legend{display:flex;gap:14px;font-size:11px;color:#6c8199}.left-color{color:#347ec0}.right-color{color:#bd718c}
.card{padding:0;overflow:hidden;border-left:4px solid var(--color);scroll-margin-top:15px}.card-head{padding:14px 18px;background:#fafcfe;border-bottom:1px solid #e0e8ef;display:flex;justify-content:space-between;gap:12px;align-items:center}.card-head h4{margin-bottom:5px}.card-body{padding:16px 18px}.paired-story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.paired-story img{width:50%;display:inline-block;vertical-align:top}.paired-story figure{border:1px solid #e2e9f0;border-radius:5px;overflow:hidden}.paired-story figcaption{padding:5px 7px;margin:0}.pair-label{font-size:10px;color:#6c8297}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:8px;border-bottom:1px solid #e6edf2;text-align:left;white-space:nowrap}th{color:#667d94;font-weight:500}.numbers td{font-family:ui-monospace,monospace}.numbers td:first-child{font-family:ReviewCJK,system-ui,sans-serif}.positive{color:#28785d}.negative{color:#a74953}
details{border:1px solid #dce5ed;border-radius:7px;margin:12px 0;overflow:hidden}summary{padding:11px 13px;font-size:12px;font-weight:600}pre{margin:0;padding:14px;background:#f7f9fc;white-space:pre-wrap;overflow-wrap:anywhere;max-height:600px;overflow:auto;font:11px/1.6 ui-monospace,monospace}.section-title{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0 5px}.section-title h3{margin:0}.reason{max-width:400px;white-space:normal}.error-row{color:#9d5a32}.footer{margin:20px 0;color:#73869b;font-size:12px}.no-img{color:#728598}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,1fr);padding:15px}aside{position:static}nav{display:flex;gap:7px;overflow:auto}nav button{min-width:160px}.videos{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.panel{padding:12px}header{padding:23px 16px}h1{font-size:22px}.paired-story{grid-template-columns:1fr}.card-body{padding:12px}.card-head{padding:12px}.toolbar{gap:7px}.stat{padding:8px 11px}}
</style>
</head><body>
<header><div class="eyebrow">REALOMNI OPEN · ATOMIC ACTION REVIEW</div><h1>首尾裁剪后的真实动作分割</h1><p class="muted">首尾各最多裁去 1 秒。IMU 与未使用的标定只记录问题；保留区间内的位姿、夹爪和图像仍须通过检查。</p><div id="stats" class="stats"></div><div class="links"><a href="examples.json" download>下载完整预览数据</a><a href="all_results.jsonl" download>18 条新判定</a><a href="VALIDATION.json">数值校验</a></div></header>
<div class="layout"><aside><span class="muted">通过检查的真实样本</span><nav id="nav"></nav><p class="muted">动作名称来自数值运动分割。此页还未生成 Qwen 物体级子任务文本；目录任务名只作来源说明。</p></aside><main id="main"></main></div>
<script id="data" type="application/json">__DATA__</script>
<script id="downloads" type="application/json">__DOWNLOADS__</script>
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#data').textContent),DOWNLOADS=JSON.parse(document.querySelector('#downloads').textContent);
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,n=3)=>Number(x).toFixed(n),pretty=x=>JSON.stringify(x,null,2),COLORS=['#4d87b6','#8b76b9','#67a48e','#c49956','#be7c91','#6c94a0'];
const VERBS={move:'移动',turn:'转动',lift:'抬升',lower:'下降',open_gripper:'开爪',close_gripper:'闭爪',still:'保持',oscillate:'往复'};
const REASONS={timestamp_gap_or_disorder:'保留区间存在关键数据时间间隙',edge_trim_exceeds_one_second:'首部或尾部需裁去超过 1 秒',incomplete_or_corrupt_video:'保留区间视频缺失或解码失败',invalid_source_pose:'保留区间位姿无效',source_clock_disorder:'时间戳倒序',stale_observation:'观测对齐超过允许年龄'};
let selected=DATA.examples.find(e=>e.id===location.hash.slice(1))||DATA.examples[0],position=0,playing=false,last=null,fullSource=false;
function detail(title,x,open=false){return `<details ${open?'open':''}><summary>${esc(title)}</summary><pre>${esc(pretty(x))}</pre></details>`;}
function actionName(s){return `左手：${VERBS[s.left_action]||s.left_action} · 右手：${VERBS[s.right_action]||s.right_action}`;}
function chart(e){const p=e.plot,min=e.retained_start_s,max=e.retained_end_s,poly=values=>values.map((v,i)=>`${20+(p.times[i]-min)/(max-min)*960},${110-Math.max(-.05,Math.min(1.1,v))*85}`).join(' ');return `<svg class="chart" viewBox="0 0 1000 130" role="img" aria-label="左右夹爪实测开度曲线"><line x1="20" y1="25" x2="980" y2="25" stroke="#dfe7ef"/><line x1="20" y1="110" x2="980" y2="110" stroke="#dfe7ef"/>${e.segments.slice(1).map(s=>`<line x1="${20+(s.start_time_seconds-min)/(max-min)*960}" y1="18" x2="${20+(s.start_time_seconds-min)/(max-min)*960}" y2="110" stroke="#dfe7ef" stroke-dasharray="3 3"/>`).join('')}<polyline fill="none" stroke="#347ec0" stroke-width="2" points="${poly(p.left_gripper)}"/><polyline fill="none" stroke="#bd718c" stroke-width="2" points="${poly(p.right_gripper)}"/><text x="1" y="28" fill="#68809a" font-size="10">1</text><text x="1" y="113" fill="#68809a" font-size="10">0</text></svg>`;}
function card(s,i){const e=selected;return `<article class="card" id="action-${i}" style="--color:${COLORS[i%6]}"><div class="card-head"><div><h4>A${String(i+1).padStart(2,'0')} · ${actionName(s)}</h4><small class="muted">${fmt(s.start_time_seconds)}–${fmt(s.target_time_seconds)} s · ${s.valid_action_rows} 个有效动作 · ${s.num_chunks} chunks</small></div><button data-segment="${i}" data-seek="${s.start_time_seconds}">定位视频</button></div><div class="card-body"><div class="paired-story">${s.review_frames.map((f,j)=>`<figure><div>${['left_wrist','right_wrist'].map(c=>`<a href="${f.images[c].path}" target="_blank"><img loading="lazy" src="${f.images[c].path}" alt="${c} ${f.frame}"></a>`).join('')}</div><figcaption>${['起点','中间','目标终点'][j]} · 保留观测 ${f.frame} · 源 ${fmt(f.source_time_s)} s<br><span class="pair-label">左图：左手相机；右图：右手相机</span></figcaption></figure>`).join('')}</div><p class="muted">动作行 ${s.start_frame}–${s.end_frame}（含首尾）；目标是观测 ${s.target_observation_frame}。源左手帧 ${s.source_start_frame} → ${s.source_target_frame}。最后一帧只作为终点观测保留。</p><h4>16D guide = 目标状态 − 起点状态</h4><div class="wrap"><table class="numbers"><thead><tr><th>手</th>${['Δx','Δy','Δz','Δqw','Δqx','Δqy','Δqz','Δgripper'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[0,8].map((offset,k)=>`<tr><td>${k?'右':'左'}</td>${s.guide_action.slice(offset,offset+8).map(v=>`<td class="${v>0?'positive':v<0?'negative':''}">${fmt(v,5)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">位置单位米；四元数为 wxyz 分量差，不是欧拉角。夹爪 delta=0 表示开度不变。每 chunk 8 行，打包时 ${s.padding_rows_if_chunked} 个 padding 槽不计入有效动作。</p>${detail('起点状态、相邻参考 action 与目标状态',{state_at_start:s.state_at_start,first_reference_action:s.first_reference_action,target_state:s.target_state,guide_action:s.guide_action,num_chunks:s.num_chunks,valid_action_rows:s.valid_action_rows})}${detail('完整分割与 primitive 来源',s)}</div></article>`;}
function render(){const e=selected;playing=false;fullSource=false;position=e.retained_start_s;last=null;
$('#nav').innerHTML=DATA.examples.map(x=>`<button class="${e.id===x.id?'active':''}" data-episode="${x.id}"><span class="badge">已分割 · ${x.segments.length} 段</span><strong>${esc(x.title)}</strong><small>${fmt(x.retained_end_s-x.retained_start_s,1)} 秒保留 · ${x.reference_action_rows} action rows</small></button>`).join('');
$('#main').innerHTML=`<h2>${esc(e.title)}</h2><div class="path">${esc(e.episode_id)}</div><div class="links" style="margin-top:12px"><a href="${e.id}/decision.json" download>本条新判定</a><a href="${e.id}/segmentation.json" download>分割 JSON</a><a href="${e.id}/reference_actions.json" download>全部状态与参考动作</a></div><div class="notice">首部裁去 <b>${fmt(e.crop.prefix_seconds)} 秒</b>，尾部裁去 <b>${fmt(e.crop.suffix_seconds)} 秒</b>。保留 ${e.measured_observations} 个实测状态，派生 ${e.reference_action_rows} 行参考 action，划分为 ${e.segments.length} 段。IMU 问题只作记录，未用于分割或目标计算。</div>
<section class="panel"><h3>保留区间与原始视频</h3><div class="cropbar"><div class="cropkept" style="left:${e.retained_start_s/e.duration_s*100}%;width:${(e.retained_end_s-e.retained_start_s)/e.duration_s*100}%">保留 ${fmt(e.retained_end_s-e.retained_start_s,2)} s</div></div><div class="ticks"><span>源 0 s</span><span>灰色首尾已删除，绿色参与分割</span><span>${fmt(e.duration_s)} s</span></div><div class="videos" style="margin-top:16px">${e.cameras.map((c,i)=>`<figure><video id="camera-${i}" muted playsinline preload="metadata" src="${c.video}" poster="${c.poster}"></video><figcaption>${i?'右手':'左手'}相机 · 按原始时间戳同步</figcaption></figure>`).join('')}</div><div class="toolbar"><button id="play">播放保留区间</button><button id="restart">回到保留起点</button><input id="scrubber" type="range" min="${e.retained_start_s}" max="${e.retained_end_s}" step=".001" value="${e.retained_start_s}" aria-label="视频时间轴"><span class="timer" id="timer"></span><select id="speed" aria-label="播放速度"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><label class="muted"><input type="checkbox" id="full-source"> 查看被裁掉的首尾（仅视频对照，不计入分割）</label><p class="muted" id="position-note"></p><div class="timeline">${e.segments.map((s,i)=>`<button data-segment="${i}" data-active="${i}" data-seek="${s.start_time_seconds}" title="A${i+1} ${actionName(s)}" style="--span:${s.valid_action_rows};--color:${COLORS[i%6]}">${i+1}</button>`).join('')}</div><div class="actions">${e.segments.map((s,i)=>`<button data-segment="${i}" data-active="${i}" data-seek="${s.start_time_seconds}" style="--color:${COLORS[i%6]}">A${i+1} · ${actionName(s)}<br><span class="muted">${fmt(s.start_time_seconds,2)}–${fmt(s.target_time_seconds,2)} s · ${s.num_chunks} chunks</span></button>`).join('')}</div></section>
<section class="panel"><h3>保留区间的实测夹爪开度</h3><div class="legend"><span class="left-color">蓝色：左手</span><span class="right-color">粉色：右手</span><span>竖线：分割边界；0 关闭，约 1 张开</span></div>${chart(e)}${detail('首尾裁剪记录与源帧映射',e.crop)}${detail(`仅作诊断的问题（${e.diagnostics.length} 项）`,e.diagnostics)}${detail('静止段吸收与长度策略',{still:e.still_audit,length:e.length_audit})}</section>
<div class="section-title"><h3>全部 ${e.segments.length} 个原子动作</h3><span class="muted">16D guide · 真实相邻状态 · 原视频定位</span></div>${e.segments.map(card).join('')}
<section class="panel" id="all-results"><h3>同一批 18 条样本：新版结果</h3><div class="wrap"><table><thead><tr><th>源任务／文件</th><th>状态</th><th>段数</th><th>裁剪 首／尾 s</th><th>拒绝原因</th></tr></thead><tbody>${DATA.all_results.map(r=>`<tr class="${r.status==='rejected'?'error-row':''}"><td>${esc(r.title)}<br><span class="path">${esc(r.episode_id)}</span></td><td>${r.status==='segmented'?'已分割':'拒绝'}</td><td>${r.segments}</td><td>${r.crop?`${fmt(r.crop.prefix_seconds)} / ${fmt(r.crop.suffix_seconds)}`:'—'}</td><td class="reason">${r.reasons.map(x=>esc(REASONS[x.code]||x.code)).join('；')||'—'}</td></tr>`).join('')}</tbody></table></div>${detail('完整新规则',DATA.policy)}</section><p class="footer">首尾裁剪后的局部轨迹不等同于原任务完整执行；分段末尾不自动表示任务成功。当前为数值分割预览。</p>`;
$$('[data-episode]').forEach(b=>b.onclick=()=>{$$('video').forEach(v=>v.pause());selected=DATA.examples.find(x=>x.id===b.dataset.episode);history.replaceState(null,'','#'+selected.id);render();});
$$('[data-seek]').forEach(b=>b.onclick=()=>{playing=false;position=+b.dataset.seek;$('#play').textContent='播放保留区间';sync(true);});
$('#play').onclick=()=>{playing=!playing;last=null;const end=fullSource?e.duration_s:e.retained_end_s;if(position>=end)position=fullSource?0:e.retained_start_s;$('#play').textContent=playing?'暂停':'播放保留区间';sync(true);};
$('#restart').onclick=()=>{position=e.retained_start_s;sync(true);};
$('#scrubber').oninput=ev=>{playing=false;position=+ev.target.value;$('#play').textContent='播放保留区间';sync(true);};
$('#full-source').onchange=ev=>{fullSource=ev.target.checked;$('#scrubber').min=fullSource?0:e.retained_start_s;$('#scrubber').max=fullSource?e.duration_s:e.retained_end_s;if(!fullSource)position=Math.max(e.retained_start_s,Math.min(e.retained_end_s,position));sync(true);};
$$('video').forEach(v=>v.onloadedmetadata=()=>sync(true));sync(true);
}
function sync(force=false){const e=selected;$('#scrubber').value=position;$('#timer').textContent=`源 ${fmt(position)} s`;const kept=position>=e.retained_start_s&&position<=e.retained_end_s;$('#position-note').textContent=kept?'当前位置在保留区间内':'当前位置在已删除的首尾区间内，不产生动作或训练样本';const active=e.segments.findIndex((s,i)=>position>=s.start_time_seconds&&(position<s.target_time_seconds||i===e.segments.length-1&&position<=s.target_time_seconds));$$('[data-active]').forEach(b=>b.classList.toggle('active',+b.dataset.active===active));e.cameras.forEach((c,i)=>{const v=$('#camera-'+i),inside=position>=c.offset_s&&position<=c.end_s;if(!v)return;v.style.opacity=inside?'1':'.2';if(v.readyState>=1){const target=Math.max(0,Math.min(c.end_s-c.offset_s,position-c.offset_s));if(force||Math.abs(v.currentTime-target)>.18)v.currentTime=target;v.playbackRate=+$('#speed').value;if(playing&&inside)v.play().catch(()=>{});else v.pause();}});}
function tick(t){if(playing){const end=fullSource?selected.duration_s:selected.retained_end_s;if(last!==null)position=Math.min(end,position+(t-last)/1000*+$('#speed').value);if(position>=end){playing=false;$('#play').textContent='播放保留区间';}sync();}last=t;requestAnimationFrame(tick);}
document.addEventListener('click',ev=>{const a=ev.target.closest('a[download]');if(!a)return;const raw=DOWNLOADS[a.getAttribute('href')];if(typeof raw!=='string')return;ev.preventDefault();const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download=a.getAttribute('href').split('/').pop();link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);});
$('#stats').innerHTML=`<span class="stat"><b>${DATA.source_episodes}</b>条重新检查</span><span class="stat"><b>0 → ${DATA.summary.segmented||0}</b>条可分割</span><span class="stat"><b>${DATA.total_segments}</b>个原子动作</span><span class="stat"><b>${DATA.summary.rejected||0}</b>条仍拒绝</span><span class="stat"><b>${DATA.examples.length}</b>条完整分割预览</span>`;
render();requestAnimationFrame(tick);
</script></body></html>
